name: ScholarBird
description: "A modern Flutter app for discovering and applying to scholarships."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.0.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.0
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.1
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  cached_network_image: ^3.4.1
  webview_flutter: ^4.10.0
  supabase_flutter: 2.5.6
  file_picker: 8.1.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  http: ^1.2.2
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Logo_scholarbird.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/pdfs/
    - .env
